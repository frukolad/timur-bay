# Збирає iOS-застосунок Тимур-Бей на безкоштовному Mac від GitHub.
# Готовий файл: вкладка Actions → останній запуск → унизу «Artifacts» → Timur-Bay-iOS.
name: iOS build
on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - "public/index.html"
      - ".github/workflows/ios.yml"
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Копіюю гру в застосунок
        run: |
          mkdir -p ios/TimurBay/www
          cp public/index.html ios/TimurBay/www/index.html
      - name: Встановлюю XcodeGen
        run: brew install xcodegen
      - name: Створюю проєкт Xcode
        run: cd ios && xcodegen generate
      - name: Збираю
        run: |
          cd ios
          xcodebuild -project TimurBay.xcodeproj -target TimurBay -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Пакую .ipa
        run: |
          cd ios
          mkdir -p Payload
          cp -R build/Release-iphoneos/TimurBay.app Payload/
          zip -qry Timur-Bay-iOS-v1.4.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Timur-Bay-iOS-v1.4
          path: ios/Timur-Bay-iOS-v1.4.ipa
